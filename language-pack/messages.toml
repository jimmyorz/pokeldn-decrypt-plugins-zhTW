"With several queued, trade again after each save; the host offers the next one." = "佇列有多隻寶可夢時，每次存檔後請再次交換，開房端會提供下一隻。"
"With several queued, trade again after each save; the joiner offers the next one." = "佇列有多隻寶可夢時，每次存檔後請再次交換，加入端會提供下一隻。"
"X, Communicate, Local Communication, Trade, enter the same link code, then search." = "X → 連線 → 鄰近主機通訊 → 連線交換，輸入相同密碼後搜尋。"
"X, Link Play, Link Trade, Nearby Players, the same code, then search." = "X → 通訊遊玩 → 連線交換 → 鄰近的人，輸入相同密碼後搜尋。"
