"The raid's boss. A boss a den can hold shows in every console's list; its level sets the stars." = "團體戰的頭目。選擇可在巢穴出現的頭目後，所有主機都會列出此團體戰；星級由頭目的等級決定。"
"The raid waits for this many consoles, each one Ready, before it starts. Each console then fights its own copy of the battle." = "團體戰會等待指定數量的主機加入並準備就緒後開始。接著每台主機會各自執行同一場對戰的副本。"
"The same code the player enters on the console." = "與玩家在主機上輸入的密碼相同。"
"The three Pokemon the player picks on the console, in the same order." = "依主機上的選擇順序，指定三隻寶可夢。"
"The three Pokemon you and your partner pick, in the same order, here and on the console." = "你與對方需在此處及主機上，依相同順序選擇三隻寶可夢。"
"The trainers who fill the slots no console holds: two with one console joining, one with two, none with three. A slot you leave unpicked gets a trainer the game draws." = "補足未由主機占用的位置：1 台主機加入時有 2 位隊友，2 台時有 1 位，3 台時沒有。未指定的位置會由遊戲抽選訓練家。"
"The Union Circle's four-digit Link Code." = "集友圈的 4 位數連線密碼。"
"The wild Pokemon that appears around you in the game, to battle and catch." = "在遊戲中生成於你周圍、可對戰與捕捉的野生寶可夢。"
"The wireless channel of the network pokeldn hosts." = "pokeldn 建立網路時使用的無線頻道。"
"Third move" = "招式 3"
"Three of the Pokemon come 15 to 25 m around you. One you battle, or walk more than 50 m from, comes back near you." = "會有三隻寶可夢出現在你周圍 15～25 公尺處。進入對戰或走到距離牠超過 50 公尺的位置後，牠會重新出現在附近。"
"Time limit (seconds)" = "時間限制（秒）"
"Title screen: Mystery Gift, Wonder Cards, Friend. For news: the second entry, Wonder News." = "標題畫面 → 神秘禮物 → 神秘卡片 → 朋友。若要接收新聞，請選擇第二項「神秘新聞」。"
"Trade an official Mystery Gift Pokemon to the console: a fresh legal copy, as your trainer received it." = "將官方配信寶可夢交換至主機：以你的訓練家領取時的資料，重新產生合法副本。"
