"Y-Comm, Link Trade, local communication; press A on both messages, then wait in the overworld." = "YY 通訊 → 連線交換 → 鄰近主機通訊；兩則提示都按 A 確認，然後在地圖上等待。"
"Y-Comm, Link Trade, local communication with the same Link Code; press A on both messages, then wait in the overworld." = "YY 通訊 → 連線交換 → 鄰近主機通訊，設定相同連線密碼；兩則提示都按 A 確認，然後在地圖上等待。"
"Y, Communicate, Trade Pokemon; accept the greeting." = "Y → 連線 → 交換寶可夢，接受對方的招呼。"
