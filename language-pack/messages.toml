"A game boost is a change to how your game plays, such as walking through walls or a faster game. Select the boosts and send them through Mystery Gift. They start immediately and stop when you restart the game or turn off the console. To restore them later, save them in the game and send Mom's gift below." = "遊戲強化可調整遊戲方式，例如穿牆或加速。選擇強化後透過神秘禮物傳送，即可立即生效；重新啟動遊戲或關閉主機後會停止。若想之後恢復，請將強化儲存於遊戲，再傳送下方媽媽的禮物。"
"Read your Trainer ID (TID), Secret ID (SID), or your party's stats in the Session log. The TID appears on your Trainer Card; the SID is normally hidden. IVs are a Pokemon's six individual stat values, from 0 to 31. EVs are stat points gained through training. These tools keep your save and Wonder Card unchanged." = "在連線紀錄中讀取訓練家 ID（TID）、裏 ID（SID）或同行寶可夢的能力值。TID 顯示於訓練家卡，SID 通常不會顯示。個體值（IV）是寶可夢六項能力各自 0～31 的數值；努力值（EV）則透過訓練取得。這些工具不會變更原有存檔與神秘卡片。"
"Poke Ball Guy tee" = "精靈球球種人 T 恤"
"Great Ball Guy tee" = "超級球球種人 T 恤"
"Ultra Ball Guy tee" = "高級球球種人 T 恤"
"Pokemon Quest tee" = "《寶可夢探險尋寶》T 恤"
"A save backup or restore sends no gift." = "存檔備份或還原不會傳送禮物。"
"Open a gift file, or choose a preset." = "請開啟禮物檔案，或選擇預設內容。"
"Speed up the game: pick a speed above x1 or faster text." = "若要加快遊戲，請選擇高於一倍速的速度，或啟用「加快文字」。"
"Add at least one step to the gift." = "請為禮物新增至少一個步驟。"
"Tick at least one boost." = "請勾選至少一項強化。"
"The Pokemon follower runs alone: untick the other boosts." = "「寶可夢跟隨」需單獨執行，請取消其他強化。"
"The card id is 1 to 65535." = "卡片 ID 範圍為 1～65535。"
"Pick at least one outfit." = "請選擇至少一套服裝。"
"The level is 0 to 100; 0 lets the game roll one." = "等級範圍為 0～100；0 表示由遊戲隨機決定。"
"Add at least one item." = "請新增至少一項道具。"
"A card carries six items at most." = "一張卡片最多可包含六項道具。"
"Battle Points are 1 to 9999." = "對戰點數範圍為 1～9999。"
"Each quantity is 1 to 999." = "每項數量範圍為 1～999。"
"Choose an Emerald preset." = "請選擇《綠寶石》的預設內容。"
"PKHeX is missing. From source, run: dotnet build -c Release services/pkhex" = "缺少 PKHeX。若從原始碼執行，請執行：dotnet build -c Release services/pkhex"
"pkhex" = "pkhex"
"The Pokemon builder stopped." = "寶可夢建立服務已停止。"
"This is not a Pokemon record of the selected game." = "此檔案不是所選遊戲的寶可夢資料。"
"The WC8 size or checksum is invalid." = "WC8 的大小或檢查碼無效。"
"PKHeX took too long to check this Pokemon." = "PKHeX 檢查此寶可夢逾時。"
"PKHeX could not complete its legality analysis after restarting the builder." = "重新啟動寶可夢建立服務後，PKHeX 仍無法完成合法性分析。"
"This file is too big to be a Pokemon or a game save." = "此檔案過大，不像是寶可夢檔案或遊戲存檔。"
"Completed trades must be a nonnegative integer." = "已完成的交換次數必須為非負整數。"
"received-mon output path" = "收到的寶可夢檔案的輸出路徑"
"trade with a player far away: their console's offer is offered here, and each side confirms only once both consoles have (docs/online.md)" = "與遠端玩家交換：在此提供對方主機送出的寶可夢，雙方主機均確認後才會確認交換（docs/online.md）"
"the room both players enter; default the link code, and no code meets anyone else trading online without one" = "雙方玩家進入的房間；預設使用連線密碼，未設密碼則配對同樣未設密碼的線上交換玩家"
"after each trade, trade again and offer the Pokemon the console just sent, so one that evolves by trade evolves on the console; the player offers ours back (docs/architecture.md, Trade back)" = "每次交換後再次交換，將主機剛送出的寶可夢換回，讓需要通訊進化的寶可夢在主機上進化；玩家需將本程式送出的寶可夢換回（docs/architecture.md，Trade back）"
"trainer name; defaults to DEFAULT_TRAINER" = "訓練家名稱；預設使用 DEFAULT_TRAINER"
"game version; defaults to DEFAULT_TRAINER" = "遊戲版本；預設使用 DEFAULT_TRAINER"
"trainer language; defaults to DEFAULT_TRAINER" = "訓練家語言；預設使用 DEFAULT_TRAINER"
"decimal trainer ID, optionally followed by decimal secret ID" = "十進位訓練家 ID，後方可選填十進位裏 ID"
"LDN passphrase hex; default uses the frlg emulator value" = "十六進位 LDN 通關密語；預設使用 frlg 模擬器的值"
"Wi-Fi phy; explicit phyN overrides --adapter" = "Wi-Fi phy；明確指定 phyN 時會優先於 --adapter"
"named Wi-Fi adapter profile used while --phy is auto" = "--phy 設為 auto 時使用的具名 Wi-Fi 網卡設定檔"
"record an optional JSONL protocol diagnostic" = "選擇性記錄 JSONL 格式的通訊協定診斷資料"
"save the received mon here (trades=1); for trades>1 this is a base/prefix and each received mon is saved as <stem>_trade<k>_<species>.pk3" = "將收到的寶可夢儲存於此（trades=1）；trades>1 時，此路徑會作為基底或前綴，各檔案命名為 <stem>_trade<k>_<species>.pk3"
"LDN passphrase as hex (live); default = the built-in 64-byte emulator passphrase (shared by frlg/rse)" = "十六進位 LDN 通關密語（即時連線）；預設使用內建的 64 位元組模擬器通關密語，frlg／rse 共用"
"wifi phy for the LDN join (live)" = "加入 LDN 網路使用的 Wi-Fi phy（即時連線）"
"Switch prod.keys (live); default: keys_path from config/host*.toml" = "Switch 的 prod.keys（即時連線）；預設取自 config/host*.toml 的 keys_path"
"(live) record every Pia datagram both directions to a .jsonl (incl. the SSID), so a live attempt can be decrypted/analysed offline" = "即時連線時，將雙向每個 Pia 資料包記錄為 .jsonl（含 SSID），供離線解密與分析"
"a complete FRLG .pokegift file, or a .wc3 Wonder Card" = "完整的 FRLG .pokegift 檔，或 .wc3 神秘卡片"
"how long to host" = "開房端持續執行的時間"
"the nickname our connection response carries" = "連線回應中攜帶的暱稱"
"1, 6, 11; code (default): the channel the link code puts a searching console on, the only one it joins on; auto: scan for the console's own network under our scene id and host on its channel" = "1、6、11；code（預設）：連線密碼決定的搜尋頻道，也是主機唯一會加入的頻道；auto：依本程式的 scene ID 掃描主機網路，並在相同頻道開房"
"the link code the player enters: three picker names (English or French) or indices 0-9, comma-separated" = "玩家輸入的連線密碼：以逗號分隔三個寶可夢圖示名稱（英文或法文），或 0～9 的索引"
"every datagram, one JSON line each" = "記錄每個資料包，每筆一行 JSON"
"the player name our identity carries, the one the trade screen shows" = "身分資料中的玩家名稱，也就是交換畫面顯示的名稱"
"write the peer's offered PB7 here" = "將對方提供的 PB7 寫入此處"
"offer every --offer and --next-offer structure under a new PID and encryption constant, shiny state kept, so a save that took it before takes it again" = "為每筆 --offer 與 --next-offer 重新產生 PID 及加密常數，保留異色狀態，讓已接收過的存檔能再次接收"
"answer the console's offer with this 232-byte box structure (echo: its own back), and its commits with commits" = "以此 232 位元組盒子資料回應主機提供的寶可夢（echo：將對方的寶可夢換回），並回應對方的提交確認"
"host over ldn_mitm for an emulator instead of the radio (docs/ldn.md)" = "使用 ldn_mitm 為模擬器開房，取代無線通訊裝置（docs/ldn.md）"
"the Mystery Gift card each --offer and --next-offer was made from, in the same order: its key in PKHeX's event database (pokeldn.pokemon.Service.gift_events)" = "依順序指定各筆 --offer 與 --next-offer 的來源神秘禮物卡片：使用 PKHeX 配信資料庫中的鍵值（pokeldn.pokemon.Service.gift_events）"
"make each --gift-event card that gives the receiver's own trainer again for the console's save, during the trade: the console offers first, a Pokemon its save caught names the trainer, and ours goes up made for it; for any other, the trainer the console's session data names. Failing both, the offer goes as given, under the trainer from Settings (pokeldn.receiver_gift, docs/gift_simulated.md)" = "交換時，對於初訓家應為領取者的 --gift-event 配信卡片，依主機存檔重新產生：主機先提供寶可夢，由此存檔捕捉的個體辨識訓練家；若無法辨識，則使用主機連線階段資料。兩者皆失敗時，保留原提供內容，使用「設定」中的訓練家（pokeldn.receiver_gift，docs/gift_simulated.md）"
"jsonl of every datagram seen while seated, hex, with its verdict" = "連線位置建立後，以 JSONL 記錄所有資料包的十六進位內容及判定結果"
"the nickname the connection response carries, what the console shows as the partner (a real station sends its Switch profile's)" = "連線回應中的暱稱，即主機顯示的交換對象名稱；實際主機會傳送其 Switch 使用者名稱"
"offer every --offer structure under a new PID and encryption constant, shiny state kept, so a save that took it before takes it again" = "為每筆 --offer 重新產生 PID 及加密常數，保留異色狀態，讓已接收過的存檔能再次接收"
"answer the host's offers with a box structure of our own. 'echo' returns the host's own, which the game accepts by construction; a path is a 232-byte structure, encrypted or not. Repeatable, one per trade on the seat; trade N writes what it received to --received with -N. After the last, a further trade is not answered and the player backs out" = "以本程式的盒子資料回應開房端。echo 會送回對方原本的資料，因此遊戲可正常接收；指定檔案時需為 232 位元組資料，可加密或未加密。可重複指定，每次交換使用一筆；第 N 次收到的資料會存至 --received 並加上 -N。最後一筆完成後，不再回應後續交換，請玩家退出"
"host over ldn_mitm on the LAN for an emulator; no radio and no root" = "透過區域網路的 ldn_mitm 為模擬器開房；不需無線通訊裝置或 root 權限"
"the party slot we offer" = "要提供的同行寶可夢位置"
"a PK8 to place in the offered party slot, encrypted or PKHeX export. Repeatable, one per trade: the player trades again from the box, or searches again; the last serves every later trade" = "放入指定同行位置的 PK8，可為加密檔或 PKHeX 匯出檔。可重複指定，每次交換使用一筆；玩家可從盒子再次交換或重新搜尋，之後的交換會持續使用最後一筆"
"draw a new encryption constant and PID for the offered Pokemon" = "為提供的寶可夢重新產生加密常數與 PID"
"write the joiner's Pokemon here; trade N > 1 writes FILE-N" = "將加入端的寶可夢寫入此處；第 N 次交換（N>1）寫入 FILE-N"
"the Link Code the player searches with, e.g. 12345678; none by default" = "玩家搜尋時使用的連線密碼，例如 12345678；預設不設密碼"
"host a Max Raid den lobby with this boss instead of a Link Trade (docs/swsh_raid.md)" = "以此頭目建立極巨團體戰巢穴大廳，取代連線交換（docs/swsh_raid.md）"
"a reward row, item id and count; up to 15; none gives an emulated den's rows" = "一列獎勵，包含道具 ID 與數量，最多 15 列；未指定則使用模擬巢穴的獎勵"
"the BattleSeed value; random by default" = "BattleSeed 值；預設隨機產生"
"host a Max Raid with a boss of this Wild Area Event delivery (an EventsGallery 'Index NNN' folder) instead of --raid-boss; its rewards unless --raid-reward (docs/swsh_raid.md, Event raids)" = "以此曠野地帶活動配信資料（EventsGallery 的 Index NNN 資料夾）建立極巨團體戰，取代 --raid-boss；未指定 --raid-reward 時使用活動獎勵（docs/swsh_raid.md，Event raids）"
"with --raid-event: whose table the boss comes from; the advertisement's version by default" = "搭配 --raid-event：指定頭目取自哪個版本的資料表；預設使用廣播的遊戲版本"
"the --raid-boss boss is Gigantamax; a retail console accepts it where a base den holds that Gigantamax Pokemon (docs/swsh_raid.md)" = "--raid-boss 指定的頭目為超極巨化個體；須選擇一般巢穴中可出現該超極巨化寶可夢的種類，實機才會接收（docs/swsh_raid.md）"
"host a Dynamax Adventure (Max Lair) lobby whose legendary is this species; the host leaves once the adventure starts (docs/swsh_raid.md)" = "建立極巨大冒險（極巨巢穴）大廳，並指定最深處的傳說的寶可夢種類；開房端會在冒險開始後離開（docs/swsh_raid.md）"
"the adventure seed (ChikaBattleSeed): the rentals and encounters; random by default" = "冒險種子（ChikaBattleSeed），決定租借與遭遇的寶可夢；預設隨機產生"
"join an emulated console hosting over ldn_mitm on the LAN; no radio, no root, no keys. Each of --scans waits --dwell seconds for an answer" = "加入透過區域網路 ldn_mitm 開房的模擬器；不需無線通訊裝置、root 權限或金鑰。每次 --scans 掃描會等待 --dwell 秒"
"--ip-join: the console's address" = "--ip-join：主機位址"
"which party slot of --send-snapshot to offer back, 1-6; 0 offers nothing and only records what the console offers us" = "要換回的 --send-snapshot 同行寶可夢位置，範圍 1～6；0 表示不提供寶可夢，只記錄主機提供的內容"
"a .pk8 to put in --offer-slot in place of the snapshot's record: stored or party form, encrypted or PKHeX's decrypted export. Its OT name and ids become the snapshot's unless --offer-file-as-is. Repeatable, one per trade on the session: the console's player picks again from the box; the last serves every later trade" = "以 .pk8 取代快照中 --offer-slot 的資料，可為盒子或同行格式、加密檔或 PKHeX 解密匯出檔。除非指定 --offer-file-as-is，否則會使用快照的初訓家名稱與 ID。可重複指定，依序用於各次交換；玩家需從盒子再次選擇，後續交換持續使用最後一筆"
"draw a new encryption constant and PID for every offered Pokemon" = "為每隻提供的寶可夢重新產生加密常數與 PID"
"the move slot our Pokemon uses every turn" = "本程式派出的寶可夢每回合使用的招式位置"
"a .pokegift or 720-byte .wc8 record to send instead of building one" = "傳送 .pokegift 或 720 位元組 .wc8 資料，取代自行建立的內容"
"the phy renumbers on every driver reload" = "每次重新載入驅動程式，phy 編號都會改變"
"prod.keys; default from config/host.toml" = "prod.keys；預設取自 config/host.toml"
"every datagram and event, one JSON line each" = "記錄每個資料包與事件，每筆一行 JSON"
"host the room the player enters with this password, e.g. 00000000" = "使用此密碼建立房間供玩家進入，例如 00000000"
"3 is French" = "3 代表法文"
"offer it under a new PID and encryption constant, shiny state kept, so a save that took it before takes it again" = "重新產生 PID 與加密常數後提供，保留異色狀態，讓已接收過的存檔能再次接收"
"the Pokemon we trade: a complete, legal, encrypted 328-byte PB8 whose PID the console's save does not already hold; repeatable, one per trade in order, the last offered again after the list" = "要交換的寶可夢：完整、合法、已加密的 328 位元組 PB8，且主機存檔尚未持有該 PID。可重複指定，依序每次交換一筆；清單用完後會重複提供最後一筆"
"the Mystery Gift card each --offer was made from, in the same order: its key in PKHeX's event database (pokeldn.pokemon.Service.gift_events)" = "依順序指定各筆 --offer 的來源神秘禮物卡片：使用 PKHeX 配信資料庫中的鍵值（pokeldn.pokemon.Service.gift_events）"
"the PlayerInfo language byte, a MsgLangId (3 is French); 1, 8, 9 and 10 cap the greeting's name at 6 characters, others at 12 (docs/bdsp_protocol.md)" = "PlayerInfo 的語言位元組 MsgLangId（3 為法文）；1、8、9、10 的招呼名稱上限為 6 字元，其餘為 12 字元（docs/bdsp_protocol.md）"
"a PB8 to offer (328 or 344 bytes, encrypted or PKHeX's decrypted export), edited by --trade-nickname and --trade-ot. 328 bytes hold much more than this project has identified, so what we send is a real Pokemon with named fields changed rather than one invented from nothing. Repeatable, one per trade in order; the last is offered again after the list" = "提供的 PB8（328 或 344 位元組，加密檔或 PKHeX 解密匯出檔），可由 --trade-nickname 與 --trade-ot 編輯。328 位元組中仍有許多未解析資料，因此使用真實寶可夢修改已知欄位，而非憑空建立。可重複指定，依序每次交換一筆；清單用完後重複最後一筆"
"nickname for the offered Pokemon" = "提供的寶可夢的暱稱"
"how long one connection request waits for its answer" = "單次連線要求等待回應的時間"
"the eight digits the player types" = "玩家輸入的 8 位數密碼"
"how long to hold the network up" = "維持網路開放的時間"
"the Mystery Gift card each --trade-box-record was made from, in the same order: its key in PKHeX's event database (pokeldn.pokemon.Service.gift_events)" = "依順序指定各筆 --trade-box-record 的來源神秘禮物卡片：使用 PKHeX 配信資料庫中的鍵值（pokeldn.pokemon.Service.gift_events）"
"write every datagram here as JSON lines" = "將每個資料包以 JSON Lines 格式寫入此處"
"the LDN node name; a retail console publishes its profile name here" = "LDN 節點名稱；實機會在此廣播其使用者名稱"
"write the record the console traded to this file, -N before the extension for trade N above 1" = "將主機交換過來的資料寫入此檔案；第 N 次交換（N>1）會在副檔名前加上 -N"
"offer the record under a new PID and encryption constant, drawn once per run, shiny state kept, so a save that took it before takes it again" = "每次執行重新產生一組 PID 與加密常數後提供，保留異色狀態，讓已接收過的存檔能再次接收"
"offer this record file instead of the reference one; stored or party, encrypted or decrypted. Repeatable, one per trade in order; the last is offered again after the list" = "以此資料檔取代參考檔，可為盒子或同行格式、加密或未加密。可重複指定，依序每次交換一筆；清單用完後重複最後一筆"
"join over ldn_mitm on the LAN; no radio and no root" = "透過區域網路的 ldn_mitm 加入；不需無線通訊裝置或 root 權限"
"the eight digits; '' joins any code" = "8 位數密碼；空字串 '' 表示加入任意密碼"
"the whole run" = "整次執行的時間"
"how long one seat is held" = "單一連線位置維持的時間"
"the name in our data exchange record; the console shows it" = "資料交換紀錄中的名稱，主機會顯示此名稱"
"the record to trade away, stored or party, encrypted or not; the default is the reference Azelf under our player name. Repeatable: one per trade in order, on this seat or in the host role once taken" = "要送出的寶可夢資料，可為盒子或同行格式、加密或未加密。預設使用以本程式玩家名稱為初訓家的參考亞克諾姆。可重複指定，依序用於此連線位置或接任開房端後的各次交換"
"write the record the console traded to this file" = "將主機交換過來的資料寫入此檔案"
"every datagram as one JSON line" = "每個資料包各記錄為一行 JSON"
"the LDN node name" = "LDN 節點名稱"
"the Link Code the player sets, e.g. 12345678; empty for none" = "玩家設定的連線密碼，例如 12345678；留空表示不設密碼"
"the player name record 1 of our identity carries, the one the trade screen shows" = "身分資料紀錄 1 攜帶的玩家名稱，即交換畫面顯示的名稱"
"offer each record under a new PID and encryption constant, shiny state kept, so a save that took it before takes it again" = "為每筆資料重新產生 PID 與加密常數，保留異色狀態，讓已接收過的存檔能再次接收"
"a file holding the 348-byte record this host offers (raw, or hex text; a 352-byte game message is stripped of its header). With it the host answers the console's offer with its own, confirms, and follows the console through the commit and the four exchange steps the way a pair's host does (pokeldn.sv.trade). Repeatable: the second and later records are offered in the same seat, one per trade, as each trade closes" = "開房端提供的 348 位元組資料檔（原始二進位或十六進位文字；352 位元組遊戲訊息會移除標頭）。指定後會回應主機的交換、確認與提交，並依開房端流程完成四個交換步驟（pokeldn.sv.trade）。可重複指定，後續資料會在同一連線位置依序用於各次交換"
"the Mystery Gift card each --trade-offer was made from, in the same order: its key in PKHeX's event database (pokeldn.pokemon.Service.gift_events)" = "依順序指定各筆 --trade-offer 的來源神秘禮物卡片：使用 PKHeX 配信資料庫中的鍵值（pokeldn.pokemon.Service.gift_events）"
"a field written into the offered record before it is sealed, by its pokeldn.sv.pokemon name: nickname=SHINY, species=906, level=50, ivs=31,31,31,31,31,31, pid=0x1234, trainer_id=12345, ball=4, moves=33,0,0,0. Repeatable, and `shiny` alone rolls a personality value shiny against the record's own ids" = "封裝提供資料前寫入的欄位，名稱依 pokeldn.sv.pokemon：nickname=SHINY、species=906、level=50、ivs=31,31,31,31,31,31、pid=0x1234、trainer_id=12345、ball=4、moves=33,0,0,0。可重複指定；單獨使用 shiny 會依資料本身的 ID 產生異色 PID"
"a file to write the console's own offer to, the 348-byte body of its 80 00 02 00 message, as hex text. What it holds is read by pokeldn.sv.pokemon" = "將主機提供的寶可夢寫入此檔案，內容為 80 00 02 00 訊息的 348 位元組主體，使用十六進位文字；可由 pokeldn.sv.pokemon 讀取"
"host a Tera Raid: the raid seed, eight hex digits; the boss, its Tera type and the rewards follow from it and the four --raid-* context flags" = "建立太晶團體戰：種子為 8 位十六進位數字；頭目、太晶屬性與獎勵由種子及四個 --raid-* 環境旗標決定"
"the party record our player brings to the raid, legal per PKHeX; with --raid-seed" = "本程式派往團體戰的同行寶可夢資料，需通過 PKHeX 合法性檢查；搭配 --raid-seed 使用"
"a reward row in place of the seed's, in order; up to 45" = "依序取代種子獎勵的獎勵列，最多 45 列"
"the story stage, which sets a standard crystal's star odds" = "劇情階段，決定一般結晶的星級機率"
"a standard or a black (six-star) crystal" = "一般結晶或黑色（6 星）結晶"
"host an event raid: a Poke Portal News delivery's folder (an EventsGallery event, or its Files); the seed draws from the event's encounters at --raid-version and --raid-progress, and --raid-map and --raid-content are unused" = "建立活動團體戰：指定寶可入口站新聞配信資料夾（EventsGallery 活動資料夾或其 Files）；種子會依 --raid-version 與 --raid-progress 抽選活動遭遇，並忽略 --raid-map 與 --raid-content"
"the delivery group of the event's den, 1 to 10; by default the first with dens and an encounter at that progress" = "活動巢穴的配信群組，範圍 1～10；預設選擇在該進度下具有巢穴與遭遇資料的第一組"
"with --raid-event: serve a catch-once encounter (every seven-star raid, Walking Wake, Iron Leaves...) as a normal catch, its capture rate normal and its record number a stand-in no save has caught, so a save that caught it may catch it again; one that cannot be caught stays so (docs/sv_raid.md, Event raids)" = "搭配 --raid-event：將每份存檔僅能捕捉一次的活動遭遇（所有 7 星團體戰、波盪水、鐵斑葉等）改為一般捕捉，恢復一般捕獲率，並使用尚未捕捉過的替代紀錄編號，讓已捕捉過的存檔能再次捕捉；原本不可捕捉的仍不可捕捉（docs/sv_raid.md，Event raids）"
"consoles the raid waits for, 1 to 3; it starts once N are in the lobby and every one is Ready, or when the lobby timer runs out" = "等待加入的主機數，範圍 1～3；當 N 台主機進入大廳且全部準備就緒，或大廳倒數結束時開始"
"join only a console searching with this Link Code; empty takes any" = "僅加入使用此連線密碼搜尋的主機；留空則不限密碼"
"join an emulated console over the LAN through ldn_mitm instead of the radio: no root, no phy, no prod.keys" = "透過區域網路的 ldn_mitm 加入模擬器，取代無線通訊裝置；不需 root 權限、phy 或 prod.keys"
"--ip-join: the emulator's address" = "--ip-join：模擬器位址"
"how long to keep trying" = "持續嘗試的時間"
"how long to stay in one joined session before scanning again" = "加入單一連線階段後，重新掃描前停留的時間"
"join the Tera Raid lobby a console hosts and bring this party record, legal per PKHeX; our player readies, answers the start and leaves when the battle begins, its Pokemon fighting on for the console" = "加入主機的太晶團體戰大廳，並派出這份通過 PKHeX 合法性檢查的同行寶可夢資料。本程式角色會準備就緒、回應開始，並在對戰開始時離開，留下寶可夢替主機繼續戰鬥"
"with --union-circle, a task after which our player leaves the circle and the run ends: snacksworth gives the host every Team and solo clear it lacks for all of Snacksworth's legendaries, one a second from the start demo's end; bp a clear paying the host the --bbq-clear BP" = "搭配 --union-circle：完成指定任務後，本程式角色會離開集友圈並結束執行。snacksworth 會在開場演出結束後，每秒替開房玩家完成一項解鎖點心大叔所有傳說的寶可夢所需的集友圈或個人任務；bp 則完成一項可獲得 --bbq-clear BP 的任務"
"the BP, 1 to 9999999, --circle-task bp gives" = "--circle-task bp 給予的 BP，範圍 1～9,999,999"
"with --union-circle: 10 s after the circle's start demo has ended, keep 3 wild Pokemon of this species (dev number) out 15 to 25 m from the host's player, as a console shares its own: one the host battles, removes or goes more than 50 m from comes again near it" = "搭配 --union-circle：開場演出結束 10 秒後，在開房玩家周圍 15～25 公尺處維持三隻指定種類（開發用編號）的野生寶可夢，模擬主機共享野生寶可夢；進入對戰、移除或離開超過 50 公尺後，會在附近重新生成"
"a file holding the 348-byte record this joiner offers (raw, or hex text; a 352-byte game message is stripped of its header). With it the joiner answers the host's offer with its own, confirms, commits, and echoes the four exchange steps the way a pair's joiner does (pokeldn.sv.trade). Repeatable: the second and later records are offered in the same seat, one per trade, as each trade closes" = "加入端提供的 348 位元組資料檔（原始二進位或十六進位文字；352 位元組遊戲訊息會移除標頭）。指定後會回應開房端的交換、確認與提交，並依加入端流程回應四個交換步驟（pokeldn.sv.trade）。可重複指定，後續資料會在同一連線位置依序用於各次交換"
"a field written into the offered record before it is sealed, by its pokeldn.sv.pokemon name: nickname=SHINY, species=906, ivs=31,31,31,31,31,31, trainer_id=12345, ball=4. Repeatable, and `shiny` alone rolls a personality value shiny against the record's own ids" = "封裝提供資料前寫入的欄位，名稱依 pokeldn.sv.pokemon：nickname=SHINY、species=906、ivs=31,31,31,31,31,31、trainer_id=12345、ball=4。可重複指定；單獨使用 shiny 會依資料本身的 ID 產生異色 PID"
"a file to write the host's own offer to, the 348-byte body of its 80 00 02 00 message, as hex text" = "將開房端提供的寶可夢寫入此檔案，內容為 80 00 02 00 訊息的 348 位元組主體，使用十六進位文字"
"seconds to allow the association itself; a console whose host phase ends mid-connect leaves ldn.connect blocked with no timeout of its own" = "建立關聯階段的等待秒數；若主機在連線途中結束開房階段，ldn.connect 會持續等待，且本身沒有逾時限制"
"a searching console put both of its measured sessions on channel 6" = "實測中，正在搜尋的主機有兩次連線都使用頻道 6"
"the link code the player types" = "玩家輸入的連線密碼"
"the LDN node name; a searching console advertises one space" = "LDN 節點名稱；正在搜尋的主機會廣播一個空格"
"the 354-byte offer message: the preview, then our pick. Repeatable, one per trade in the seat; the last serves every later trade" = "354 位元組的提供訊息，包含預覽及本程式的選擇。可重複指定，在同一連線位置每次交換使用一筆；後續交換持續使用最後一筆"
"send the offer under a new PID and encryption constant, shiny state kept, so a save that took this record before takes it again" = "重新產生 PID 與加密常數後送出，保留異色狀態，讓已接收過此資料的存檔能再次接收"
"write the Pokemon the console picks here; trade N > 1 writes FILE-N. A preview, the console's cursor on its box, is not written" = "將主機選定的寶可夢寫入此處；第 N 次交換（N>1）寫入 FILE-N。不會儲存主機在盒子中移動游標時的預覽資料"
"host an emulated console over ldn_mitm, with no radio" = "透過 ldn_mitm 為模擬器開房，不使用無線通訊裝置"
"how long to hold one seat" = "單一連線位置維持的時間"
"bound the association alone; the seat itself is not bounded by it" = "僅限制建立關聯階段的時間，不限制連線位置的持續時間"
"only join a console waiting on this link code" = "僅加入等待此連線密碼的主機"
"the name the Session join's PlayerInfo carries; a reference joiner sends one space" = "Session 加入訊息中 PlayerInfo 攜帶的名稱；參考加入端會傳送一個空格"
"write the host's offered PA9 here; trade N > 1 writes FILE-N" = "將開房端提供的 PA9 寫入此處；第 N 次交換（N>1）寫入 FILE-N"
"a 354-byte offer message to send once the streams are open. Repeatable, one per trade in the seat; the last serves every later trade" = "串流開啟後送出的 354 位元組提供訊息。可重複指定，在同一連線位置每次交換使用一筆；後續交換持續使用最後一筆"
"join an emulated host over the LAN through its ldn_mitm bridge, with no radio and no root" = "透過區域網路及 ldn_mitm 橋接加入模擬器開房端，不需無線通訊裝置或 root 權限"
"The card holds a male and a female version; the player gets their own" = "卡片包含男性與女性版本，玩家會收到符合自身性別的版本"
"Listed under Mystery Gift; the player picks it, then it lands in the save." = "顯示於神秘禮物清單，玩家選擇後便會存入存檔。"
"Shown on the Wonder News screen as soon as it is received." = "接收後立即顯示於神秘新聞畫面。"
"Runs on the console while it receives, inside the Mystery Gift menu." = "主機接收時，會在神秘禮物選單內執行。"
"Your ARM code, checked offline before it is sent" = "你的 ARM 程式碼，傳送前會先進行離線檢查"
"any cartridge; call no ROM address" = "任何遊戲版本；不呼叫 ROM 位址"
"Received once per save" = "每份存檔僅可領取一次"
"The player can pass the card on" = "玩家可將卡片轉送給其他人"
"Choose the save to put on the console." = "請選擇要還原至主機的存檔。"
"This save has no whole copy of a game in it." = "此存檔不含任何完整的遊戲存檔副本。"
"Checking the save's party with PKHeX..." = "正在使用 PKHeX 檢查存檔中的同行寶可夢⋯"
"Save boosts for later" = "儲存強化供日後使用"
"After sending the saved boosts, send \"Mom restores your boosts\" once. After each restart, talk to Mom at home in Pallet Town to turn them back on. Send Mom's gift again if you receive another Wonder Card." = "傳送已儲存的強化後，請再傳送一次「由媽媽恢復強化」。每次重新啟動後，到真新鎮家中與媽媽對話即可重新啟用。若收到其他神秘卡片，請再次傳送媽媽的禮物。"
"Keep a copy of these boosts in your save. After sending the saved boosts, send \"Mom restores your boosts\" once. After each restart, talk to Mom at home in Pallet Town to turn them back on. Send Mom's gift again if you receive another Wonder Card." = "在存檔中保留這些強化的副本。傳送已儲存的強化後，請再傳送一次「由媽媽恢復強化」。每次重新啟動後，到真新鎮家中與媽媽對話即可重新啟用。若收到其他神秘卡片，請再次傳送媽媽的禮物。"
"Text prints faster" = "加快文字顯示"
"Counts down to the next shiny wild Pokemon in the grass, top right of the screen" = "在畫面右上角顯示距離下次在草叢遇見異色野生寶可夢的倒數"
"No grass, water or roaming encounters; fishing and Sweet Scent still work" = "不發生草叢、水面或遊走寶可夢遭遇；釣魚與甜甜香氣仍可使用"
"The lead Pokemon's six IVs and its nature, top right of the overworld" = "在地圖畫面右上角顯示隊首寶可夢的六項個體值與性格"
"The lead Pokemon walks behind you, hops ledges with you, and smiles and cries when you face it and press A" = "隊首寶可夢會跟在身後，與你一起跳下高低差；面向牠按 A 時，牠會微笑並發出叫聲"
"the delivery man" = "配送員"
"mom" = "媽媽"
"the man in pallet town" = "真新鎮的男子"
"title" = "標題"
"body" = "內文"
"subtitle" = "副標題"
"footer1" = "頁尾 1"
"footer2" = "頁尾 2"
"The gift" = "禮物"
"Wild battle" = "野生寶可夢對戰"
