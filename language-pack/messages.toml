"Trade (Online)" = "交換（線上）"
"Trade with a player far away: each of you hosts your own console, and the two trade through the internet." = "與遠端玩家交換：雙方各自連接自己的主機，再透過網際網路交換。"
"Trainer language" = "訓練家語言"
