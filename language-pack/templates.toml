# API 1.9 訊息範本；term* 欄位可繼續套用術語翻譯。
"Could not open {path}: {reason}" = "無法開啟 {path}：{reason}"
"Could not read {path}: {reason}" = "無法讀取 {path}：{reason}"
"Not saved: {reason}" = "未儲存：{reason}"
"Names: {message_reason}" = "名稱：{message_reason}"
"Gives {term_species}, level {level}" = "給予等級 {level} 的{term_species}"
"Gives a {term_species} egg" = "給予{term_species}的蛋"
"Gives {term_item} x{quantity}" = "給予{term_item} ×{quantity}"
"Gives {term_details}" = "給予{term_details}"
"Holding {term_item}" = "攜帶{term_item}"
"Starts a battle with a wild {term_species}, level {level}" = "與野生的等級 {level} {term_species}開始對戰"
"Says “{text}”" = "顯示「{text}」"
"News “{title}”" = "新聞「{title}」"
"Built for {term_cartridge}" = "適用版本：{term_cartridge}"
"Puts the {message_outfit} in the wardrobe" = "將{message_outfit}加入衣櫃"
"Adds {amount} Battle Points" = "增加 {amount} 對戰點數"
"Adds {amount} to the player's money, up to {maximum}" = "為玩家增加 {amount} 金錢，上限為 {maximum}"
"Card id {id}: a console takes the same id again" = "卡片 ID {id}：主機可再次領取相同 ID 的卡片"
"Every time the player talks to {message_giver}, until another gift is received" = "每次與{message_giver}對話時生效，直到收到其他禮物"
"Runs when the player talks to {message_giver}, {message_where}." = "{message_where}，與{message_giver}對話時執行。"
"Runs when the player talks to {message_giver} in {message_where}. The card is not shown while that person holds the gift." = "在{message_where}與{message_giver}對話時執行。由該角色持有禮物期間，卡片不會顯示。"
"Step {number}" = "步驟 {number}"
"Card {message_field} line {number}" = "卡片{message_field}第 {number} 行"
"Card {message_field}" = "卡片{message_field}"
"Sword and Shield have no item {number}." = "《劍／盾》沒有編號 {number} 的道具。"
"Sword and Shield have no item above {number}." = "《劍／盾》沒有編號大於 {number} 的道具。"
"The nature is 0 to {maximum}." = "性格編號範圍為 0～{maximum}。"
"Money is 1 to {maximum}." = "金錢範圍為 1～{maximum}。"
"A card carries {count} pieces of clothing at most; pick fewer outfits." = "一張卡片最多可包含 {count} 件服飾，請減少選取的服裝。"
"Unknown gift kind {kind}." = "未知的禮物類型 {kind}。"
"Unknown outfit {outfit}." = "未知的服裝 {outfit}。"
"PKHeX finds {pokemon} in this save's party not legal. Fix it in the editor, or turn on Restore anyway." = "PKHeX 判定此存檔同行寶可夢中的{pokemon}不合法。請在編輯器修正，或啟用「仍要還原」。"
"Gathering board details for {device}; the board may restart." = "正在收集 {device} 的開發板資訊；開發板可能會重新啟動。"
"Board details copied: paste them into your message. A copy is in {path}." = "已複製開發板資訊，請貼到你的訊息中。另已儲存一份副本至 {path}。"
"Could not gather board details: {reason}" = "無法收集開發板資訊：{reason}"
"Removing the gift kept on {device}." = "正在移除儲存在 {device} 的禮物。"
"Counts down to the next shiny {term_species}, top right of the screen" = "在畫面右上角顯示距離下次遇見異色{term_species}的倒數"
"{message_first} and {message_second} both draw in the top-right corner: untick one." = "「{message_first}」與「{message_second}」都會顯示在畫面右上角，請取消其中一項。"
"{message_first} and {message_second} and {message_third} both draw in the top-right corner: untick one." = "「{message_first}」、「{message_second}」與「{message_third}」都會顯示在畫面右上角，請取消其中一項。"
"These boosts take {used} bytes together; the console has room for {capacity}. Untick one." = "這些強化合計需要 {used} 位元組，但主機只能容納 {capacity} 位元組。請取消其中一項。"
"{term_species} cannot be an Alpha in this game." = "本遊戲中沒有頭目{term_species}。"
"{term_species} is always an Alpha in this game." = "本遊戲中的{term_species}一定是頭目個體。"
"No legal {term_species} in this game has an Alpha." = "本遊戲中沒有合法的頭目{term_species}。"
"No legal {term_species} in this game has a Pokemon that is not an Alpha." = "本遊戲中沒有合法的非頭目{term_species}。"
"This encounter cannot give {term_species} with these moves." = "此遭遇資料無法產生具有這些招式的{term_species}。"
"No legal {term_species} in this game has this sweet." = "本遊戲中沒有使用此糖飾的合法{term_species}。"
"No legal {term_species} in this game has the Gigantamax factor." = "本遊戲中沒有具有超極巨化因子的合法{term_species}。"
"No legal {term_species} in this game has no Gigantamax factor." = "本遊戲中沒有不具超極巨化因子的合法{term_species}。"
"No legal {term_species} in this game has Dynamax level {level}." = "本遊戲中沒有極巨化等級為 {level} 的合法{term_species}。"
"No legal {term_species} in this game has this Tera Type." = "本遊戲中沒有此太晶屬性的合法{term_species}。"
